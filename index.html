<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Uji Berkala Kendaraan Bermotor (Uji KIR)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; }
        .hero-section {
            background: linear-gradient(135deg, #0d6efd, #198754);
            color: white;
            padding: 40px 0;
            margin-bottom: 30px;
            border-radius: 0 0 20px 20px;
        }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-radius: 12px; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="hero-section text-center">
        <div class="container">
            <h2><i class="fa-solid fa-truck-fast me-2"></i>Pendaftaran Uji Berkala Online</h2>
            <p class="lead mb-0">UPUBKB - Layanan Pengujian Kendaraan Bermotor Cepat & Transparan</p>
        </div>
    </div>

    <!-- Form Pendaftaran -->
    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="text-primary mb-0"><i class="fa-solid fa-file-pen me-2"></i>Formulir Pendaftaran Uji</h4>
                        <a href="admin.html" target="_blank" class="btn btn-sm btn-outline-secondary"><i class="fa-solid fa-lock me-1"></i> Login Admin</a>
                    </div>
                    <form id="formPendaftaran">
                        <div class="mb-3">
                            <label class="form-label">Nama Pemilik Kendaraan</label>
                            <input type="text" class="form-control" id="namaPemilik" required placeholder="Masukkan nama lengkap">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nomor Polisi (Plat Nomor)</label>
                            <input type="text" class="form-control" id="noKendaraan" required placeholder="Contoh: BL 1234 XX">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Jenis Kendaraan</label>
                            <select class="form-select" id="jenisKendaraan" required>
                                <option value="" selected disabled>Pilih Jenis Kendaraan</option>
                                <option value="Mobil Barang / Truk">Mobil Barang / Truk</option>
                                <option value="Mobil Penumpang Umum">Mobil Penumpang Umum</option>
                                <option value="Bus">Bus</option>
                                <option value="Kendaraan Khusus">Kendaraan Khusus</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rencana Tanggal Uji</label>
                            <input type="date" class="form-control" id="tglUji" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nomor WhatsApp Pemohon</label>
                            <input type="tel" class="form-control" id="noHp" required placeholder="Contoh: 081234567890">
                        </div>
                        <button type="submit" id="btnSubmit" class="btn btn-success w-100 py-2">
                            <i class="fa-solid fa-paper-plane me-2"></i>Kirim Pendaftaran & Kirim Auto WA Admin
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyB8VcHPV7Hv7HZI5Bz0QQyApIRKN3EHDF8",
            authDomain: "pendaftaran-kir.firebaseapp.com",
            databaseURL: "https://pendaftaran-kir-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "pendaftaran-kir",
            storageBucket: "pendaftaran-kir.firebasestorage.app",
            messagingSenderId: "985444773290",
            appId: "1:985444773290:web:7669e9a4853f6dd2154fd3",
            measurementId: "G-F2DY53ERLR"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const form = document.getElementById('formPendaftaran');
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Menyimpan...';

            const namaPemilik = document.getElementById('namaPemilik').value;
            const noKendaraan = document.getElementById('noKendaraan').value.toUpperCase();
            const jenisKendaraan = document.getElementById('jenisKendaraan').value;
            const tglUji = document.getElementById('tglUji').value;
            const noHp = document.getElementById('noHp').value;
            const waktuDaftar = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            const dataBaru = {
                id: Date.now(),
                waktuDaftar,
                namaPemilik,
                noKendaraan,
                jenisKendaraan,
                tglUji,
                noHp
            };

            try {
                // 1. Simpan ke Firebase Realtime Database
                const antreanRef = ref(db, 'antreanUji');
                const newAntreanRef = push(antreanRef);
                await set(newAntreanRef, dataBaru);

                // 2. Simpan cadangan ke Local Storage browser lokal
                let antrean = JSON.parse(localStorage.getItem('antreanUji')) || [];
                antrean.unshift(dataBaru);
                localStorage.setItem('antreanUji', JSON.stringify(antrean));

                // 3. Konfigurasi Token Fonnte & Nomor WA Admin secara permanen
                let token = "SCrsdWcfG9VNK39D7ozJ";
                let target = "6283194063956";

                if (token && target) {
                    let pesan = `*PENDAFTARAN UJI KIR MASUK*%0A` +
                                `----------------------------------------%0A` +
                                `• Nama Pemilik: *${namaPemilik}*%0A` +
                                `• No. Polisi: *${noKendaraan}*%0A` +
                                `• Jenis: ${jenisKendaraan}%0A` +
                                `• Tgl Uji: *${tglUji}*%0A` +
                                `• No WA Pemohon: ${noHp}%0A` +
                                `----------------------------------------%0A` +
                                `Pesan otomatis sistem SIM PKB.`;

                    // Kirim otomatis via API Fonnte ke HP Anda dari perangkat apa pun
                    fetch('https://api.fonnte.com/send', {
                        method: 'POST',
                        headers: {
                            'Authorization': token,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            target: target,
                            message: decodeURIComponent(pesan),
                            countryCode: '62'
                        })
                    }).catch(err => console.log('Gagal kirim background API:', err));
                }

                alert('Pendaftaran Berhasil! Data telah disimpan ke Database Firebase dan Notifikasi WhatsApp telah dikirim.');
                form.reset();
            } catch (error) {
                console.error("Gagal menyimpan ke Firebase: ", error);
                alert('Terjadi kesalahan saat menyimpan data ke database.');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i>Kirim Pendaftaran & Kirim Auto WA Admin';
            }
        });
    </script>
</body>
</html>
